version: 1
disable_existing_loggers: False

formatters:
  standard:
    format: "[%(asctime)s] [%(levelname)s] [%(name)s:%(lineno)d] %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file_handler:
    class: logging.FileHandler
    level: INFO
    formatter: standard
    # 使用 Python 格式化生成带时间戳的日志文件
    filename: logs/app.log
    encoding: utf-8

loggers:
  root:
    level: INFO
    handlers: [console, file_handler]

  mymodule:
    level: INFO
    handlers: [console, file_handler]
    propagate: no